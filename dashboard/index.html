<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon Scheduler · Grid Control Room</title>
<style>
  :root {
    --bg: #0b0f0e; --panel: #121917; --line: #1f2a27; --text: #e6efe9; --muted: #7d8f88;
    --clean: #3ddc97; --mid: #e8c547; --dirty: #ff6b4a; --accent: #7fd1ff;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; min-height: 100vh; }
  body::before { /* faint grid, like a control-room screen */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px; }
  .wrap { position: relative; max-width: 1280px; margin: 0 auto; padding: 24px; }

  header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .brand { font-family: var(--mono); letter-spacing: .18em; font-size: 13px; color: var(--muted); }
  .brand b { color: var(--clean); font-weight: 600; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--clean); box-shadow: 0 0 0 0 var(--clean); animation: pulse 2s infinite; }
  .dot.off { background: var(--dirty); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(61,220,151,.6); } 100% { box-shadow: 0 0 0 10px rgba(61,220,151,0); } }
  .ring { width: 28px; height: 28px; cursor: pointer; }
  .ring circle { fill: none; stroke-width: 3; }

  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  .hero h1 { font-size: 30px; font-weight: 600; line-height: 1.2; margin: 8px 0 6px; }
  .hero h1 em { font-style: normal; color: var(--clean); }
  .hero .sub { color: var(--muted); }
  .verdict { display: inline-flex; gap: 8px; align-items: center; margin-top: 12px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-family: var(--mono); }
  .verdict.good { background: rgba(61,220,151,.12); color: var(--clean); }
  .verdict.bad { background: rgba(255,107,74,.12); color: var(--dirty); }
  .verdict.none { background: #1b2421; color: var(--muted); }

  .strip { display: grid; grid-template-columns: 70px repeat(12, 1fr); gap: 4px; margin-top: 22px; align-items: center; }
  .strip .name { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .cell { height: 38px; border-radius: 6px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: #0b0f0e; font-weight: 600; position: relative; transition: transform .2s; }
  .cell:hover { transform: translateY(-2px); }
  .cell.best { outline: 2px solid #fff; outline-offset: 2px; }
  .hour { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; }

  .chart { margin-top: 26px; }
  .chart svg { width: 100%; height: 240px; display: block; }
  .legend { display: flex; gap: 18px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }

  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 20px; }
  @media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi .v { font-family: var(--mono); font-size: 26px; margin-top: 6px; }
  .kpi .h { font-size: 12px; color: var(--muted); }

  .feed { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; max-height: 720px; overflow: auto; }
  .run { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .2s, background .2s; }
  .run:hover { border-color: #2f403b; }
  .run.sel { border-color: var(--accent); background: rgba(127,209,255,.05); }
  .run.fresh { animation: flash 2.5s ease-out; }
  @keyframes flash { from { background: rgba(61,220,151,.25); } to { background: transparent; } }
  .run .top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; }
  .run .res { font-family: var(--mono); font-size: 13px; margin: 2px 0; }
  .run .file { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pos { color: var(--clean); } .neg { color: var(--dirty); } .na { color: var(--muted); }

  .pipe { margin-top: 20px; font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pipe span { border: 1px solid var(--line); padding: 3px 8px; border-radius: 6px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>CARBON</b> / SCHEDULER · FRENCH GRID CONTROL ROOM</div>
    <div class="live">
      <span class="dot" id="dot"></span><span id="status">connecting…</span>
      <svg class="ring" viewBox="0 0 36 36" id="ring" title="Refresh now">
        <circle cx="18" cy="18" r="15" stroke="#1f2a27"/>
        <circle cx="18" cy="18" r="15" stroke="#7fd1ff" id="ringArc" stroke-dasharray="94.2" stroke-dashoffset="0" transform="rotate(-90 18 18)"/>
      </svg>
    </div>
  </header>

  <div class="grid">
    <main>
      <section class="panel hero" id="hero"><div class="empty">Waiting for the first forecast… upload a CSV to <code>input/</code>.</div></section>
      <section class="kpis" id="kpis"></section>
    </main>
    <aside class="panel">
      <div class="label">Live feed · newest first</div>
      <div class="feed" id="feed"></div>
    </aside>
  </div>

  <div class="pipe">
    <span>input/</span>→<span>Event Grid</span>→<span>dispatcher</span>→<span>queue</span>→<span>worker</span>→<span>API (Container App)</span>→<span>Cosmos DB</span>→<span>/api/recent</span>→<span>this page</span>
  </div>
</div>

<script>
// API address: default is our Function App; "?api=..." overrides it (used for local testing).
const API = new URLSearchParams(location.search).get("api") ||
  "https://func-carbonsched-ckaxdgh3hcfnhpfw.francecentral-01.azurewebsites.net/api/recent?n=20";
const REFRESH_S = 30;

let runs = [], selectedId = null, knownIds = new Set(), lastOk = null, tick = 0;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
const fmtDay = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Europe/Paris" });
const pct = (v) => v == null ? "n/a" : (v > 0 ? "+" : "") + v.toFixed(1) + " %";
const cls = (v) => v == null ? "na" : v >= 0 ? "pos" : "neg";
const ago = (iso) => { const s = Math.round((Date.now() - new Date(iso)) / 1000); return s < 60 ? s + " s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago"; };

// colour scale: clean green -> amber -> red, relative to the values shown
function colour(v, lo, hi) {
  const t = hi > lo ? (v - lo) / (hi - lo) : 0;
  const stops = [[61, 220, 151], [232, 197, 71], [255, 107, 74]];
  const [a, b, u] = t < .5 ? [stops[0], stops[1], t * 2] : [stops[1], stops[2], (t - .5) * 2];
  return `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * u)).join(",")})`;
}

async function load() {
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const fresh = data.filter((d) => knownIds.size && !knownIds.has(d.id + d.processed_at)).map((d) => d.id);
    knownIds = new Set(data.map((d) => d.id + d.processed_at));
    runs = data;
    if (fresh.length) selectedId = fresh[0];            // jump to the newest forecast
    if (!runs.find((d) => d.id === selectedId)) selectedId = runs[0]?.id ?? null;
    lastOk = Date.now();
    $("dot").classList.remove("off");
    render(fresh);
  } catch (e) {
    $("dot").classList.add("off");
    $("status").textContent = "API unreachable · " + e.message;
  }
}

function render(fresh = []) {
  renderFeed(fresh); renderKpis();
  const run = runs.find((d) => d.id === selectedId);
  if (run) renderHero(run);
}

function renderHero(d) {
  const hero = $("hero"); hero.replaceChildren();
  hero.append(el("div", "label", `Next 12 h from ${fmtDay(d.forecast_times[0])} ${fmtTime(d.forecast_times[0])} · model ${d.model_version}`));
  const h1 = el("h1"); h1.append("Run a 2 h job at ", el("em", null, fmtTime(d.best_window_start)), " instead of now");
  hero.append(h1);
  hero.append(el("div", "sub", `Predicted ${d.best_window_avg_co2} g/kWh in the window vs ${d.run_now_avg_co2} g/kWh if started now → ${pct(d.co2_saved_pct)} less CO₂ expected.`));

  const v = d.actual_saved_pct;
  const verdict = v == null ? ["none", "Reality not known yet"] : v >= 0 ? ["good", `✓ Advice confirmed by real data: ${pct(v)} CO₂ saved`] : ["bad", `✗ Advice missed: in reality, waiting cost ${Math.abs(v).toFixed(1)} % more CO₂ than running now`];
  hero.append(el("div", "verdict " + verdict[0], verdict[1]));

  // carbon strip: one coloured cell per forecast hour
  const all = d.forecast_co2.concat((d.actual_co2 || []).filter((x) => x != null));
  const lo = Math.min(...all), hi = Math.max(...all);
  const bestIdx = new Set(d.forecast_times.map((t, i) => [t, i]).filter(([t]) => new Date(t) >= new Date(d.best_window_start) && new Date(t) < new Date(d.best_window_end)).map(([, i]) => i));
  const strip = el("div", "strip");
  strip.append(el("div"));
  d.forecast_times.forEach((t) => strip.append(el("div", "hour", fmtTime(t))));
  const row = (name, values) => {
    strip.append(el("div", "name", name));
    values.forEach((v, i) => {
      const c = el("div", "cell" + (bestIdx.has(i) ? " best" : ""), v == null ? "–" : Math.round(v));
      c.style.background = v == null ? "#1b2421" : colour(v, lo, hi);
      c.title = `${fmtTime(d.forecast_times[i])}: ${v ?? "n/a"} g/kWh`;
      strip.append(c);
    });
  };
  row("predicted", d.forecast_co2);
  if (d.actual_co2) row("actual", d.actual_co2);
  hero.append(strip);

  const chart = el("div", "chart"); chart.innerHTML = svgChart(d, lo, hi, bestIdx);
  const legend = el("div", "legend");
  legend.innerHTML = '<span><i style="background:#7fd1ff"></i>predicted</span><span><i style="background:#e6efe9"></i>actual (RTE 2024)</span><span><i style="background:rgba(61,220,151,.35);height:10px"></i>advised window</span>';
  chart.append(legend);
  hero.append(chart);
}

function svgChart(d, lo, hi, bestIdx) {
  const W = 800, H = 240, P = 34, n = d.forecast_co2.length;
  const pad = (hi - lo) * .15 || 1, y0 = lo - pad, y1 = hi + pad;
  const x = (i) => P + i * (W - 2 * P) / (n - 1);
  const y = (v) => H - P - (v - y0) / (y1 - y0) * (H - 2 * P);
  const path = (vals) => vals.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean).join(" ");
  const idx = [...bestIdx];
  const band = idx.length ? `<rect x="${x(Math.min(...idx)) - 10}" y="${P - 10}" width="${x(Math.max(...idx)) - x(Math.min(...idx)) + 20}" height="${H - 2 * P + 20}" fill="rgba(61,220,151,.12)" rx="8"/>` : "";
  let grid = "";
  for (let k = 0; k <= 4; k++) { const v = y0 + (y1 - y0) * k / 4; grid += `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="#1f2a27"/><text x="4" y="${y(v) + 4}" fill="#7d8f88" font-size="10" font-family="monospace">${v.toFixed(0)}</text>`; }
  const dots = (vals, c) => vals.map((v, i) => v == null ? "" : `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${c}"><title>${fmtTime(d.forecast_times[i])}: ${v} g/kWh</title></circle>`).join("");
  const actual = d.actual_co2 ? `<polyline points="${path(d.actual_co2)}" fill="none" stroke="#e6efe9" stroke-width="2" stroke-dasharray="5 4"/>${dots(d.actual_co2, "#e6efe9")}` : "";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${band}
    <polyline points="${path(d.forecast_co2)}" fill="none" stroke="#7fd1ff" stroke-width="2.5" class="draw"/>${dots(d.forecast_co2, "#7fd1ff")}${actual}
    <text x="${W - P}" y="${P - 14}" fill="#7d8f88" font-size="10" text-anchor="end" font-family="monospace">g CO₂ / kWh</text></svg>`;
}

function renderKpis() {
  const k = $("kpis"); k.replaceChildren();
  const withActual = runs.filter((d) => d.actual_saved_pct != null);
  const avg = (a) => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
  const lat = runs.map((d) => d.api_latency_ms).sort((a, b) => a - b);
  const items = [
    ["Forecasts processed", runs.length, "files that went through the pipeline"],
    ["Avg predicted saving", pct(avg(runs.map((d) => d.co2_saved_pct))), "what the model expected"],
    ["Avg real saving", pct(avg(withActual.map((d) => d.actual_saved_pct))), "checked against RTE data"],
    ["Advice hit rate", withActual.length ? Math.round(100 * withActual.filter((d) => d.actual_saved_pct >= 0).length / withActual.length) + " %" : "n/a", "real saving ≥ 0"],
    ["Median API latency", lat.length ? lat[Math.floor(lat.length / 2)].toFixed(0) + " ms" : "n/a", "model inference time"],
  ];
  for (const [name, value, hint] of items) {
    const c = el("div", "panel kpi"); c.append(el("div", "label", name), el("div", "v", value), el("div", "h", hint)); k.append(c);
  }
}

function renderFeed(fresh) {
  const f = $("feed"); f.replaceChildren();
  if (!runs.length) { f.append(el("div", "empty", "No forecast yet")); return; }
  for (const d of runs) {
    const r = el("div", "run" + (d.id === selectedId ? " sel" : "") + (fresh.includes(d.id) ? " fresh" : ""));
    const top = el("div", "top");
    top.append(el("span", null, `${fmtDay(d.forecast_times[0])} ${fmtTime(d.forecast_times[0])}`));
    const res = el("div", "res"); res.append(el("span", "na", "pred "), el("span", cls(d.co2_saved_pct), pct(d.co2_saved_pct)), el("span", "na", "  real "), el("span", cls(d.actual_saved_pct), pct(d.actual_saved_pct)));
    r.append(top, res, el("div", "file", `${d.file} · ${ago(d.processed_at)} · try ${d.attempt}`));
    r.onclick = () => { selectedId = d.id; render(); };
    f.append(r);
  }
}

// 30 s refresh with a countdown ring; click the ring to refresh now
function loop() {
  tick = (tick + 1) % REFRESH_S;
  $("ringArc").setAttribute("stroke-dashoffset", (94.2 * tick / REFRESH_S).toFixed(1));
  if (lastOk) $("status").textContent = `live · updated ${Math.round((Date.now() - lastOk) / 1000)} s ago · next in ${REFRESH_S - tick} s`;
  if (tick === 0) load();
}
$("ring").onclick = () => { tick = 0; load(); };
load(); setInterval(loop, 1000);
</script>
</body>
</html>
